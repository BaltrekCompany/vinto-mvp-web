name: E1-05 Supervisión UI and execution projection

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/app/work_orders/line_execution.py'
      - 'backend/app/work_orders/router.py'
      - 'backend/tests/test_line_execution_supervision_read.py'
      - 'lib/vinto/line-execution.ts'
      - 'lib/vinto/line-execution-api.ts'
      - 'lib/vinto/work-order-capabilities.ts'
      - 'components/vinto/line-execution-panel.tsx'
      - 'components/vinto/bobinas-programming.tsx'
      - 'components/vinto/activate-all-dialog.tsx'
      - 'scripts/e1-05-supervision.test.mjs'
      - '.github/workflows/e1-05-supervision.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Corepack and pnpm
        run: |
          corepack enable
          pnpm --version
          pnpm install --frozen-lockfile
      - name: E1-05 pure UI contract tests
        run: node --test scripts/e1-05-supervision.test.mjs scripts/pr6-order-draft.test.mjs
      - name: TypeScript validation
        run: pnpm exec tsc --noEmit
      - name: ESLint touched frontend modules
        run: pnpm exec eslint components/vinto/line-execution-panel.tsx components/vinto/bobinas-programming.tsx components/vinto/activate-all-dialog.tsx lib/vinto/line-execution.ts lib/vinto/line-execution-api.ts lib/vinto/work-order-capabilities.ts

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-disposable-pg17-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/vinto_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Read projection and current shift QA
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_line_execution_supervision_read.py' -v
      - name: E1-03 service regression
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_line_execution_flow.py' -v
      - name: E1-04 capture guard regression
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_capture_line_execution_guard.py' -v
