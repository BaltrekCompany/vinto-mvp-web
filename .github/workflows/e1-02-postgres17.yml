name: E1-02 PostgreSQL 17

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/migrations/0013_work_order_line_execution.sql'
      - 'backend/tests/test_work_order_line_execution_schema.py'
      - '.github/workflows/e1-02-postgres17.yml'

permissions:
  contents: read

jobs:
  schema-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-disposable-pg17-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/vinto_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout source (no persistent credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Verify PostgreSQL 17 server
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ['TEST_ADMIN_DATABASE_URL']) as conn:
              version = int(conn.execute('SHOW server_version_num').fetchone()[0])
              print('PostgreSQL version:', conn.execute('SHOW server_version').fetchone()[0])
          assert 170000 <= version < 180000, f'Expected PostgreSQL 17, received {version}'
          PY

      - name: E1-02 database schema and concurrency tests
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_work_order_line_execution_schema.py' -v

      - name: MF-13 assignment regression tests
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_assignment_same_work_order.py' -v
