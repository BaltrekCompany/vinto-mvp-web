name: OFF-04.5B-03 QA Pilot Bootstrap, Migration 0032 and Authz Probe QA (isolated, synthetic)

on:
  pull_request:
    paths:
      - 'backend/app/qa_pilot_main.py'
      - 'backend/app/qa_offline_pilot.py'
      - 'backend/app/qa_offline_guard.py'
      - 'backend/app/offline_capture/**'
      - 'backend/offline_capture_migration/**'
      - 'backend/migrate.py'
      - 'backend/tests/test_off045b*'
      - 'backend/tests/off044_*'
      - 'docs/OFF-04-5B-03-*.md'
      - '.github/workflows/off-04-5b-03-qa-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-bootstrap-postgres17:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-disposable-pg17-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/vinto_ci_unused
      OFF044_PG_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/postgres
      OFF044_REQUIRE_PG: '1'
      OFF045B03_REQUIRE_PG: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt pytest httpx
      - name: Entrypoint, migration 0032 promotion/grants/rollback and authz probe on throwaway PostgreSQL 17 (never a deployed database)
        working-directory: backend
        run: python -m pytest tests/test_off045b03_qa_bootstrap.py -v
      - name: Guard, receiver and signing regressions (OFF-04.4, OFF-04.5B-01, OFF-03C)
        working-directory: backend
        run: |
          python -m pytest tests/test_off045b_qa_pilot.py tests/test_off044_receiver.py -q
          python -m pytest tests/test_off03c1_unit.py tests/test_off03b2_signing.py -q
      - name: The proposal is still not an operational migration and nothing imports the entrypoint
        run: |
          test ! -e backend/migrations/0032_offline_capture_receipt.sql
          test -z "$(ls backend/migrations | grep -i offline || true)"
          test -s backend/offline_capture_migration/proposed_0032_offline_capture_receipt.sql
          test -s backend/offline_capture_migration/proposed_0032_offline_capture_receipt.rollback.sql
          ! grep -q "qa_pilot_main\|qa_offline_pilot\|offline_capture" backend/app/main.py
          ! grep -rl "qa_pilot_main" backend/app --include=*.py | grep -v "backend/app/qa_pilot_main.py"
