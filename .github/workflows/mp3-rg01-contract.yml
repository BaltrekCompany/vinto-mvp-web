name: VINTO RG-MP3-01 isolated form contract

on:
  pull_request:
    paths:
      - 'lib/vinto/mp3-operation-spec.ts'
      - 'lib/vinto/mp3-operation.ts'
      - 'lib/vinto/availability.ts'
      - 'lib/vinto/bobinas-offers.ts'
      - 'lib/vinto/bobinas-candidates.ts'
      - 'backend/app/mp3_inspection_policy.py'
      - 'backend/app/capture_service.py'
      - 'backend/app/capture_errors.py'
      - 'backend/app/production_access.py'
      - 'backend/tests/test_mp3_inspection_policy.py'
      - 'backend/tests/test_mp3_rg01_http_pg17.py'
      - 'backend/tests/test_mp3_import_gate_pg17.py'
      - 'backend/mp3_rg01_import_gate.py'
      - 'deploy/mvp/scripts/mp3_rg01_import_release.sh'
      - 'scripts/mf11-calidad-conversion.test.mjs'
      - 'scripts/mf12a-p101-availability.test.mjs'
      - 'scripts/mf12b-fibra-merma.test.mjs'
      - 'scripts/p1-02-p1-01-capture.test.mjs'
      - 'scripts/p1-04-capture.test.mjs'
      - 'scripts/p1-30-p1-07-capture.test.mjs'
      - 'scripts/mp3-operation-spec.test.mjs'
      - 'scripts/generate-mp3-rg01-bundle.mjs'
      - 'backend/seed_data/forms/VINTO-MP3-01.json'
      - 'backend/seed_data/manifest.json'
      - 'docs/RG-MP3-01-contrato-captura-por-turno.md'
      - '.github/workflows/mp3-rg01-contract.yml'
  push:
    branches:
      - 'feat/mp3-rg01-form-20261109'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: MP3 field contract, types and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Verify RG01 seed integrity
        run: node scripts/generate-mp3-rg01-bundle.mjs --check
      - name: MP3 and historical updated contracts
        run: |
          node --test scripts/mp3-operation-spec.test.mjs scripts/mf11-calidad-conversion.test.mjs scripts/mf12a-p101-availability.test.mjs scripts/mf12b-fibra-merma.test.mjs scripts/p1-02-p1-01-capture.test.mjs scripts/p1-04-capture.test.mjs scripts/p1-30-p1-07-capture.test.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: ESLint
        run: pnpm exec eslint lib/vinto/mp3-operation-spec.ts lib/vinto/mp3-operation.ts lib/vinto/availability.ts lib/vinto/bobinas-offers.ts lib/vinto/bobinas-candidates.ts

  backend-policy:
    name: MP3 server policy and unit regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Syntax and operational script checks
        run: |
          python -B -m compileall -q backend/app/mp3_inspection_policy.py backend/app/capture_errors.py backend/app/capture_service.py backend/app/production_access.py backend/tests/test_mp3_inspection_policy.py backend/mp3_rg01_import_gate.py backend/tests/test_mp3_import_gate_pg17.py
          bash -n deploy/mvp/scripts/mp3_rg01_import_release.sh
      - name: Validate complete seed bundle and machine scope
        working-directory: backend
        run: |
          python -B -c "from app.seed.bundle import load_bundle; b=load_bundle(); f=next(f for f in b.forms if f['code']=='VINTO-MP3-01'); assert f['machines']==['MP3']; assert len(f['fields'])==133; print('RG01_SEED_BUNDLE=PASS')"
      - name: MP3 isolated policy tests
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_mp3_inspection_policy.py' -v

  mp3-pg17:
    name: RG01 backend HTTP and concurrency on real PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/vinto_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: MP3 cross-machine HTTP, once-per-shift and concurrent POST
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_mp3_rg01_http_pg17.py' -v
      - name: Dry-run, allowlist import and idempotency on PostgreSQL 17
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_mp3_import_gate_pg17.py' -v
