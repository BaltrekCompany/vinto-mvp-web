name: OFF-03D1 Mobile HTTPS Staging Preflight Contract

on:
  pull_request:
    paths:
      - 'scripts/off-03d1-https-preflight.sh'
      - 'scripts/off-03d1-preflight.test.mjs'
      - 'docs/OFF-03D1-preflight-qa-movil-real.md'
      - '.github/workflows/off-03d1-mobile-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-readonly-preflight-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Check POSIX shell parsing and executable QA gates (synthetic curl only)
        run: |
          bash -n scripts/off-03d1-https-preflight.sh
          node --test scripts/off-03d1-preflight.test.mjs
