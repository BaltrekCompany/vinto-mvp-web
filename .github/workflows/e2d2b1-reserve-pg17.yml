name: E2-D2-B1 reserve and cancel PostgreSQL17

on:
  pull_request:
    paths:
      - 'backend/migrations/0020_e2d2_supervisor_reservation.sql'
      - 'backend/app/work_orders/handoff_service.py'
      - 'backend/app/work_orders/router.py'
      - 'backend/app/work_orders/errors.py'
      - 'backend/tests/test_e2d2b1_reserve_cancel.py'
      - 'backend/tests/test_sector_scope.py'
      - '.github/workflows/e2d2b1-reserve-pg17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2d2b1-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/vinto_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile changed backend and tests
        run: |
          python -B -m compileall -q backend/app/work_orders/handoff_service.py \
            backend/app/work_orders/router.py backend/app/work_orders/errors.py \
            backend/tests/test_e2d2b1_reserve_cancel.py
      - name: B1 isolated PG17 supervisor reserve/cancel
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_e2d2b1_reserve_cancel.py' -v
      - name: B0 guard regression
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_e2d2b0_handoff_guard.py' -v
      - name: Static migration checksums
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_sector_scope.py' -v
