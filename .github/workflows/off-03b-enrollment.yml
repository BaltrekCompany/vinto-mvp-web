name: OFF-03B Online Enrollment and Offline Unlock QA

on:
  pull_request:
    paths:
      - 'lib/vinto/offline-boot.ts'
      - 'app/offline-preparacion/page.tsx'
      - 'scripts/build-offline-boot.mjs'
      - 'scripts/off-03b-*'
      - 'public/offline.html'
      - 'public/sw.js'
      - 'scripts/run-framework.mjs'
      - '.github/workflows/off-03b-enrollment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Verify offline enrollment safety contract
        run: node --test scripts/off-03b-contract.test.mjs
      - name: Install frozen frontend dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: TypeScript and lint
        run: |
          pnpm exec tsc --noEmit
          pnpm lint
      - name: Build release artifact and verify generated offline runtime
        run: |
          pnpm build
          test -s dist/standalone/server.js
          test -s public/offline-boot.js
          test -s dist/standalone/public/offline-boot.js
          cmp -s public/offline-boot.js dist/standalone/public/offline-boot.js
          node --check public/offline-boot.js
          echo "OFF03B_PORTABLE_RUNTIME=PASS"

  chrome-offline-unlock:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install frontend and Playwright
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
          python3 -m pip install --break-system-packages playwright==1.57.0
          google-chrome --version
      - name: Start isolated VINTO frontend
        run: |
          set -eu
          nohup pnpm dev > "$RUNNER_TEMP/off03b-dev.log" 2>&1 &
          for i in $(seq 1 35); do
            for endpoint in 'http://localhost:5173/' 'http://127.0.0.1:5173/' 'http://[::1]:5173/'; do
              if curl --fail --silent --noproxy '*' --connect-timeout 1 --max-time 3 --output /dev/null "$endpoint"; then
                echo "OFF03B_BASE_URL=${endpoint%/}" >> "$GITHUB_ENV"
                exit 0
              fi
            done
            sleep 2
          done
          tail -n 140 "$RUNNER_TEMP/off03b-dev.log"
          exit 1
      - name: Chrome online synthetic enrollment, shutdown, offline unlock
        env:
          OFF03B_BASE_URL: ${{ env.OFF03B_BASE_URL }}
          OFF03B_SCREENSHOT: ${{ runner.temp }}/off03b-offline-unlock.png
        run: python3 scripts/off-03b-browser-smoke.py
      - name: Save browser evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: off03b-chrome-offline-unlock
          path: ${{ runner.temp }}/off03b-offline-unlock.png
          retention-days: 14
      - name: Show dev logs on failure
        if: failure()
        run: tail -n 140 "$RUNNER_TEMP/off03b-dev.log" || true
