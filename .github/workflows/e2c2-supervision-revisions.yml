name: E2-C2 supervision revisions PostgreSQL17 and frontend

on:
  pull_request:
    paths:
      - 'backend/migrations/0018_supervision_revision_receipts.sql'
      - 'backend/app/work_orders/**'
      - 'backend/tests/test_work_orders_api.py'
      - 'backend/tests/test_sector_scope.py'
      - 'lib/vinto/supervision-revision-api.ts'
      - 'components/vinto/supervision-revision-inbox.tsx'
      - 'app/page.tsx'
      - 'scripts/e2c2-supervision-revisions.test.mjs'
      - '.github/workflows/e2c2-supervision-revisions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2c2-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/vinto_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Python compilation
        run: python -B -m compileall -q backend/app/work_orders backend/tests/test_work_orders_api.py
      - name: PG17 supervisor notices, receipts and work order regressions
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_work_orders_api.py' -v
      - name: Historical migration checksums and sector scope
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_sector_scope.py' -v
      - name: E2-C1 operator and assignment regressions
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_assignments_api.py' -v

  e2c2-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: E2-C2 HTTP UI contract
        run: node --test scripts/e2c2-supervision-revisions.test.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: ESLint
        run: pnpm exec eslint components/vinto/supervision-revision-inbox.tsx lib/vinto/supervision-revision-api.ts app/page.tsx
