name: E2-D0 aggregate read-only preflight

on:
  pull_request:
    paths:
      - 'backend/app/work_orders/e2d_readiness.py'
      - 'backend/app/work_orders/e2d_readiness_cli.py'
      - 'backend/tests/test_e2d_readiness.py'
      - 'docs/E2-D0-DIAGNOSTICO-Y-DECISIONES.md'
      - '.github/workflows/e2d0-readonly-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2d0-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/vinto_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile read-only collector and tests
        run: python -B -m compileall -q backend/app/work_orders/e2d_readiness.py backend/app/work_orders/e2d_readiness_cli.py backend/tests/test_e2d_readiness.py
      - name: PostgreSQL17 aggregate-only guard and classification
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_e2d_readiness.py' -v
      - name: Existing execution rollout preflight regressions
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_rollout_preflight_e108.py' -v
