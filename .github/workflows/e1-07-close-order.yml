name: E1-07 manual close work order PostgreSQL 17 and UI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/app/work_orders/close_order.py'
      - 'backend/app/work_orders/router.py'
      - 'backend/tests/test_work_order_close_flow.py'
      - 'backend/tests/test_work_order_close_api.py'
      - 'lib/vinto/line-execution.ts'
      - 'lib/vinto/line-execution-api.ts'
      - 'components/vinto/line-execution-panel.tsx'
      - 'scripts/e1-07-work-order-close.test.mjs'
      - '.github/workflows/e1-07-close-order.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Close contract and E1-05/E1-06 regressions
        run: node --test scripts/e1-07-work-order-close.test.mjs scripts/e1-05-supervision.test.mjs scripts/e1-06-operation.test.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: ESLint
        run: pnpm exec eslint components/vinto/line-execution-panel.tsx lib/vinto/line-execution.ts lib/vinto/line-execution-api.ts

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-disposable-pg17-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/vinto_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: python -m pip install -r backend/requirements.txt
      - name: E1-07 close service, idempotency and concurrent finish
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_work_order_close_flow.py' -v
      - name: E1-07 HTTP authorization and close contracts
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_work_order_close_api.py' -v
      - name: E1-06 machine execution read regression
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_machine_execution_read.py' -v
      - name: E1-04 F3/F6 capture serialization
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_capture_line_execution_guard.py' -v
      - name: E1-03 line lifecycle regression
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_line_execution_flow.py' -v
