name: VINTO Calidad isolated integration and UX

on:
  pull_request:
    paths:
      - 'backend/app/quality/**'
      - 'backend/tests/test_quality_bobbin_decision_*.py'
      - 'backend/migrations/0023_quality_release_decision.sql'
      - 'components/vinto/quality-bobbin-*'
      - 'lib/vinto/quality-decision-api.ts'
      - 'scripts/quality-bobbin-inbox.test.mjs'
      - 'scripts/quality-bobbin-ux.test.mjs'
      - '.github/workflows/quality-pr159-isolated.yml'
  push:
    branches:
      - 'feat/quality-bobbin-release-reject-20261109'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-backend-pg17:
    name: Quality release/reject API, service and DB integration (PG17)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/vinto_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Syntax gates
        run: |
          python -B -m compileall -q backend/app/quality backend/tests/test_quality_bobbin_decision_schema.py backend/tests/test_quality_bobbin_decision_service.py backend/tests/test_quality_bobbin_decision_api.py
      - name: Contract, service and live DB17 HTTP checks
        working-directory: backend
        run: |
          python -B -m unittest discover -s tests -p 'test_quality_bobbin_decision_schema.py' -v
          python -B -m unittest discover -s tests -p 'test_quality_bobbin_decision_service.py' -v
          python -B -m unittest discover -s tests -p 'test_quality_bobbin_decision_api.py' -v
      - name: Global sector scope, permissions and migration checksum regression
        working-directory: backend
        env:
          PYTHONPATH: tests:.
        run: python -B -m unittest -v test_sector_scope.StaticScopeTests
      - name: Historical inbox regression
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_quality_bobbin_inbox_api.py' -v
      - name: Historical quality capture regression
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_quality_capture_api.py' -v

  quality-frontend:
    name: TypeScript, ESLint and isolated frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Inbox and irreversible-decision UX regression
        run: node --test scripts/quality-bobbin-inbox.test.mjs scripts/quality-bobbin-ux.test.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: ESLint
        run: pnpm exec eslint components/vinto/quality-bobbin-decision.tsx components/vinto/quality-bobbin-inbox.tsx lib/vinto/quality-decision-api.ts
      - name: Frontend build (no deployment)
        run: pnpm run build
