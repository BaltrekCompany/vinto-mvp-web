name: USR-02 admin user creation isolated PostgreSQL 17

on:
  pull_request:
    paths:
      - 'backend/migrations/**'
      - 'backend/app/admin/**'
      - 'backend/app/auth/**'
      - 'backend/app/main.py'
      - 'backend/tests/test_user_creation_api.py'
      - 'backend/tests/test_auth_service.py'
      - 'backend/tests/test_auth_api.py'
      - 'backend/tests/test_auth_sessions.py'
      - 'backend/tests/test_user_deactivation.py'
      - 'backend/tests/test_admin_sector_api.py'
      - 'backend/tests/test_admin_grants_read_api.py'
      - 'backend/tests/test_admin_grants_write_api.py'
      - '.github/workflows/usr-02-user-creation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usr-02-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin:ci-only-disposable-password@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin:ci-only-disposable-password@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin:ci-only-disposable-password@127.0.0.1:5432/vinto_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: python -m pip install -r backend/requirements.txt
      - name: Confirm PostgreSQL 17
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["TEST_ADMIN_DATABASE_URL"]) as conn:
              n = int(conn.execute("SHOW server_version_num").fetchone()[0])
          assert 170000 <= n < 180000, n
          print("USR02_POSTGRES_VERSION=PASS")
          PY
      - name: Syntax
        run: python -B -m compileall -q backend/app/admin backend/app/main.py backend/tests/test_user_creation_api.py
      - name: Migrate isolated test database
        working-directory: backend
        run: python -B prepare_test_db.py
      - name: USR-02 HTTP and SQL
        working-directory: backend
        run: python -B -m unittest tests.test_user_creation_api -v
      - name: Existing authentication and account lifecycle regression
        working-directory: backend
        run: python -B -m unittest tests.test_auth_service tests.test_user_deactivation tests.test_auth_api tests.test_auth_schema tests.test_auth_sessions -v
      - name: Existing admin sectors/grants regression
        working-directory: backend
        run: python -B -m unittest tests.test_admin_sector_api tests.test_admin_grants_read_api tests.test_admin_grants_write_api -v
