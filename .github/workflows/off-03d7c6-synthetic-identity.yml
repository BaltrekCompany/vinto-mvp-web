name: OFF-03D7C6 QA Synthetic Identity Safety Contract

on:
  pull_request:
    paths:
      - 'backend/tests/test_off03d7c6_qa_synthetic_identity_readiness.py'
      - 'docs/OFF-03D7C6-qa-synthetic-identity-readiness.md'
      - '.github/workflows/off-03d7c6-synthetic-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-static-identity-access-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend packages in disposable runner
        run: python -m pip install -r backend/requirements.txt
      - name: Validate QA identity and write-exposure risk without DB or secrets
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p test_off03d7c6_qa_synthetic_identity_readiness.py -v
