name: E2-D2-B0 isolated reservation gates (PostgreSQL 17)

on:
  pull_request:
    paths:
      - 'backend/migrations/0019_work_order_line_reprogram_handoff.sql'
      - 'backend/app/config.py'
      - 'backend/app/assignments/service.py'
      - 'backend/app/capture_service.py'
      - 'backend/app/work_orders/line_execution.py'
      - 'backend/app/work_orders/handoff_guard.py'
      - 'backend/app/work_orders/errors.py'
      - 'backend/tests/test_e2d2b0_handoff_guard.py'
      - '.github/workflows/e2d2b0-isolated-pg17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2d2b0-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/vinto_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile all changed Python modules
        run: |
          python -B -m compileall -q backend/app/work_orders/handoff_guard.py \
            backend/app/work_orders/line_execution.py backend/app/assignments/service.py \
            backend/app/capture_service.py backend/tests/test_e2d2b0_handoff_guard.py
      - name: E2-D2-B0 reservation guard PostgreSQL17
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_e2d2b0_handoff_guard.py' -v
      - name: Regression E1 execution and F3/F6 production
        working-directory: backend
        run: |
          python -B -m unittest discover -s tests -p 'test_capture_line_execution_guard.py' -v
          python -B -m unittest discover -s tests -p 'test_e2d1_unassigned_in_progress.py' -v
          python -B -m unittest discover -s tests -p 'test_e2d1_concurrency.py' -v
