name: VINTO RBE-04 backend and child reservations

on:
  pull_request:
    paths:
      - '.github/workflows/rbe-04-backend-reservations.yml'
      - 'backend/migrations/0032_rewinding_export_backend.sql'
      - 'backend/migrations/README.md'
      - 'backend/roles/03_table_grants.sql'
      - 'backend/roles/README.md'
      - 'backend/app/auth/permissions.py'
      - 'backend/app/main.py'
      - 'backend/app/rewinding_export/**'
      - 'backend/tests/test_rewinding_export_contract.py'
      - 'backend/tests/test_rewinding_export_concurrency.py'
      - 'backend/app/authz/policies.py'
      - 'backend/tests/test_schema.py'
      - 'backend/tests/test_sector_scope.py'
      - 'docs/VINTO-RBE-04-BACKEND-RESERVAS-CIERRE-TECNICO-2026-11-28.md'
  workflow_dispatch:

concurrency:
  group: rbe04-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pg17:
    name: RBE-04 migration, permissions and reservation contract (isolated PG17)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: rbe04-disposable-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin:rbe04-disposable-only@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin:rbe04-disposable-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin:rbe04-disposable-only@127.0.0.1:5432/vinto_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
      WORK_ORDER_LINE_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned Python requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Compile RBE backend and prepare disposable PostgreSQL 17
        working-directory: backend
        run: |
          mkdir -p ../rbe04-ci-evidence
          python -B -m compileall -q app/rewinding_export tests/test_rewinding_export_contract.py tests/test_rewinding_export_concurrency.py
          python -B prepare_test_db.py 2>&1 | tee ../rbe04-ci-evidence/migration.log
          python -B migrate.py --target test --check 2>&1 | tee -a ../rbe04-ci-evidence/migration.log
      - name: RBE permission, transaction and immutable PDF contract tests
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_rewinding_export_contract.py' -v 2>&1 | tee ../rbe04-ci-evidence/contracts.log
      - name: PostgreSQL schema, trigger and historical sector regression
        working-directory: backend
        run: |
          python -B -m unittest discover -s tests -p 'test_schema.py' -v 2>&1 | tee ../rbe04-ci-evidence/schema.log
          python -B -m unittest discover -s tests -p 'test_sector_scope.py' -v 2>&1 | tee ../rbe04-ci-evidence/sector.log
      - name: RBE concurrent operators and reservation chain on disposable PostgreSQL 17
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_rewinding_export_concurrency.py' -v 2>&1 | tee ../rbe04-ci-evidence/concurrency.log
      - name: Publish RBE-04 PG17 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbe04-pg17-${{ github.run_id }}
          path: rbe04-ci-evidence/
          if-no-files-found: warn
          retention-days: 14
