name: E1-03 line execution API PostgreSQL 17

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/app/work_orders/line_execution.py'
      - 'backend/app/work_orders/router.py'
      - 'backend/app/assignments/service.py'
      - 'backend/app/config.py'
      - 'backend/tests/test_line_execution_flow.py'
      - '.github/workflows/e1-03-postgres17.yml'

permissions:
  contents: read

jobs:
  api-line-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-disposable-pg17-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/vinto_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: python -m pip install -r backend/requirements.txt
      - name: Logical line execution service tests
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_line_execution_flow.py' -v
      - name: Assignment regression (flag OFF)
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_assignment_same_work_order.py' -v
