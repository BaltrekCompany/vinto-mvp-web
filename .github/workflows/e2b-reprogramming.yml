name: E2-B published OT revisions PostgreSQL 17 and UI

on:
  pull_request:
    paths:
      - 'backend/migrations/0016_work_order_reprogramming.sql'
      - 'backend/app/work_orders/**'
      - 'backend/app/assignments/service.py'
      - 'backend/tests/test_activate_all.py'
      - 'backend/tests/test_assignments_service.py'
      - 'backend/tests/test_work_orders_api.py'
      - 'backend/tests/test_sector_scope.py'
      - 'components/vinto/bobinas-programming.tsx'
      - 'lib/vinto/orders.ts'
      - 'lib/vinto/work-orders-api.ts'
      - 'scripts/pr6-programming-ui.test.mjs'
      - '.github/workflows/e2b-reprogramming.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-e2b:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-e2b-throwaway-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin:ci-e2b-throwaway-only@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin:ci-e2b-throwaway-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin:ci-e2b-throwaway-only@127.0.0.1:5432/vinto_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile E2-B modules
        run: python -B -m compileall -q backend/app/work_orders backend/app/assignments backend/tests
      - name: Versioning and HTTP authorization on PG17
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_work_orders_api.py' -v
      - name: E1 individual assignment integration with revisions
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_assignments_service.py' -v
      - name: E1 mass activation stale plan protection
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_activate_all.py' -v
      - name: Schema checksum and sector-scope regression
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_sector_scope.py' -v

  frontend-e2b:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: E2-B programming and HTTP regression
        run: node --test scripts/pr6-programming-ui.test.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: ESLint touched E2-B modules
        run: pnpm exec eslint components/vinto/bobinas-programming.tsx lib/vinto/work-orders-api.ts lib/vinto/orders.ts
