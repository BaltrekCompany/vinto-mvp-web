name: OFF-03D6C2 QA Guarded Migration Runner Gate

on:
  pull_request:
    paths:
      - 'scripts/off-03d6c2-qa-migration-runner.sh'
      - 'scripts/off-03d6c2-qa-migration-runner.test.mjs'
      - 'docs/OFF-03D6C2-qa-migration-runner.md'
      - '.github/workflows/off-03d6c2-qa-migration-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-fail-closed-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Syntax and negative authorization tests
        run: |
          bash -n scripts/off-03d6c2-qa-migration-runner.sh
          node --test scripts/off-03d6c2-qa-migration-runner.test.mjs

  ephemeral-postgres17-migrations-and-acl:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconfirm 31 migration and ACL compatibility
        run: bash scripts/off-03d5-migrations-ci-e2e.sh
