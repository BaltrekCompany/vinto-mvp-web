name: VINTO CV-P113-01 Servilletas v3 isolated QA

on:
  pull_request:
    paths:
      - '.github/workflows/cv-p113-v3.yml'
      - 'backend/migrations/0031_p113_napkin_pallet_weights.sql'
      - 'backend/app/production_pallets.py'
      - 'backend/app/production_access.py'
      - 'backend/app/p113_recipe_policy.py'
      - 'backend/app/capture_service.py'
      - 'backend/seed_data/forms/VINTO-P1-13.json'
      - 'backend/seed_data/manifest.json'
      - 'backend/tests/test_cv_p113_v3_api.py'
      - 'lib/vinto/p1-13-v3.ts'
      - 'components/vinto/p1-13-v3-capture.tsx'
      - 'lib/vinto/candidate-form.ts'
      - 'lib/vinto/conversion-candidates.ts'
      - 'components/vinto/candidate-history.tsx'
      - 'app/page.tsx'
      - 'scripts/cv-p113-v3.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg17:
    name: P1-13 v3 recetas y pallets PostgreSQL17
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: cvp113-disposable-only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin:cvp113-disposable-only@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin:cvp113-disposable-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin:cvp113-disposable-only@127.0.0.1:5432/vinto_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
      WORK_ORDER_LINE_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Provision ACL role
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["TEST_ADMIN_DATABASE_URL"], autocommit=True) as db:
              db.execute("CREATE ROLE vinto_app NOLOGIN")
          PY
      - name: Syntax and migrations PG17
        working-directory: backend
        run: |
          python -B -m compileall -q app/production_pallets.py app/p113_recipe_policy.py app/capture_service.py app/production_access.py tests/test_cv_p113_v3_api.py
          python -B prepare_test_db.py
          python -B migrate.py --target test --check
      - name: P1-13 v3 real API regression
        working-directory: backend
        run: |
          python -B -m unittest discover -s tests -p 'test_cv_p113_v3_api.py' -v
          python -B -m unittest discover -s tests -p 'test_cv_p112_pallet_api.py' -v
      - name: Bundle and P1-11 compatibility
        working-directory: backend
        run: |
          python -B -m unittest discover -s tests -p 'test_bundle_validation.py' -v
          python -B -m unittest discover -s tests -p 'test_cv_p111_recipe_api.py' -v

  frontend:
    name: P1-13 v3 UX receta tipado lint build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      VINTO_MVP_DOMAIN: vinto-mvp.baltrekservices.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: P1-13 v3 contract + P1-11/12 regressions
        run: |
          node --test scripts/cv-p113-v3.test.mjs
          node --test scripts/cv-p112-pallet.test.mjs
          node --test scripts/p1-11-capture.test.mjs
      - name: Types and lint
        run: |
          pnpm exec tsc --noEmit
          pnpm exec eslint components/vinto/p1-13-v3-capture.tsx lib/vinto/p1-13-v3.ts lib/vinto/conversion-candidates.ts lib/vinto/candidate-form.ts app/page.tsx
      - name: Production build
        run: pnpm run build
