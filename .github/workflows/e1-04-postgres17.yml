name: E1-04 capture execution guard PostgreSQL 17

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/app/capture_service.py'
      - 'backend/app/capture_errors.py'
      - 'backend/tests/test_capture_line_execution_guard.py'
      - '.github/workflows/e1-04-postgres17.yml'

permissions:
  contents: read

jobs:
  capture-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-disposable-pg17-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/vinto_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: python -m pip install -r backend/requirements.txt
      - name: E1-04 capture execution guard and concurrency
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_capture_line_execution_guard.py' -v
      - name: E1-03 line execution regressions
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_line_execution_flow.py' -v
      - name: F3 legacy regression, flag OFF
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_f3_bobbin_service.py' -v
      - name: F6 legacy regression, flag OFF
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_f6_capture_service.py' -v
