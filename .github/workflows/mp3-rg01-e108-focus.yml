name: RG-MP3-01 E1-08 newly-failing regression focus
on:
  pull_request:
    paths:
      - 'backend/tests/**'
      - 'backend/app/**'
      - 'scripts/mp3-rg01-broad-focus.*'
      - '.github/workflows/mp3-rg01-e108-focus.yml'
  push:
    branches:
      - 'feat/mp3-rg01-form-20261109'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rg01-e108-focus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  focused-regression:
    name: Original 55 E1-08 formerly-new tests with no allowances
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-disposable-pg17-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/vinto_ci_unused
      WORK_ORDER_LINE_EXECUTION_ENABLED: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Repeat all formerly-new failures exactly without skips or baseline expansion
        run: python -B scripts/mp3-rg01-broad-focus.py
