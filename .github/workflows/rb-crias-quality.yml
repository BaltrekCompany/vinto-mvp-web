name: VINTO RB-CRIA-01 P1-07 crías and Quality isolated QA

on:
  pull_request:
    paths:
      - '.github/workflows/rb-crias-quality.yml'
      - 'backend/migrations/0026_rewinding_child_quality.sql'
      - 'backend/app/rewinding_children.py'
      - 'backend/app/capture_service.py'
      - 'backend/app/quality/**'
      - 'backend/seed_data/forms/VINTO-P1-07.json'
      - 'backend/seed_data/manifest.json'
      - 'backend/tests/test_rb_crias_quality_api.py'
      - 'backend/tests/test_mf10_rebobinado_conversion.py'
      - 'lib/vinto/p1-07.ts'
      - 'lib/vinto/quality-bobbins.ts'
      - 'lib/vinto/rebobinado-candidates.ts'
      - 'components/vinto/quality-bobbin-*.tsx'
      - 'scripts/rb-crias-quality.test.mjs'
      - 'scripts/mf10-rebobinado-conversion.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg17:
    name: P1-07 v3 and Quality isolated PG17
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: rbcria-disposable-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin:rbcria-disposable-only@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin:rbcria-disposable-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin:rbcria-disposable-only@127.0.0.1:5432/vinto_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
      WORK_ORDER_LINE_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned Python requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Syntax and migrations in disposable PostgreSQL 17
        working-directory: backend
        run: |
          python -B -m compileall -q app/rewinding_children.py app/capture_service.py app/quality tests/test_rb_crias_quality_api.py
          python -B prepare_test_db.py
          python -B migrate.py --target test --check
      - name: New P1-07 child and Quality end-to-end tests
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_rb_crias_quality_api.py' -v
      - name: Historical P1-07 v1/v2 regression
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_mf10_rebobinado_conversion.py' -v
      - name: F3 MP1 MP3 and Quality decision compatibility
        working-directory: backend
        run: |
          python -B -m unittest discover -s tests -p 'test_quality_bobbin_decision_api.py' -v
          python -B -m unittest discover -s tests -p 'test_quality_bobbin_inbox_api.py' -v

  frontend:
    name: P1-07, Quality UX, TypeScript and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      VINTO_MVP_DOMAIN: vinto-mvp.baltrekservices.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: P1-07 and Quality functional UI contracts
        run: |
          node --test scripts/rb-crias-quality.test.mjs             scripts/mf10-rebobinado-conversion.test.mjs             scripts/quality-bobbin-inbox.test.mjs             scripts/quality-bobbin-ux.test.mjs
      - name: Types, changed components lint and portable frontend build
        run: |
          pnpm exec tsc --noEmit
          pnpm exec eslint             components/vinto/quality-bobbin-decision.tsx             components/vinto/quality-bobbin-inbox.tsx             lib/vinto/quality-bobbins.ts lib/vinto/p1-07.ts             lib/vinto/rebobinado-candidates.ts
          pnpm run build
