name: OFF-03B2 Signed Scope Snapshot (default OFF)

on:
  pull_request:
    paths:
      - 'backend/app/offline_scope/**'
      - 'backend/app/main.py'
      - 'backend/app/config.py'
      - 'backend/requirements.txt'
      - 'backend/tests/test_off03b2_*.py'
      - '.github/workflows/off-03b2-signed-scope.yml'
      - 'docs/OFF-03B2-firma-alcance-offline.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      APP_ENV: ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Pure Ed25519 and fail-closed authorization tests
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_off03b2_signing.py' -v
      - name: Static compilation and import checks
        working-directory: backend
        run: python -B -m compileall -q app/offline_scope app/config.py app/main.py

  postgres17-effective-grants:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-disposable-pg17-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      PYTHONDONTWRITEBYTECODE: '1'
      TEST_DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/vinto_ci_unused
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Issue, revoke and reissue with real PostgreSQL17 effective grants
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_off03b2_pg17.py' -v
