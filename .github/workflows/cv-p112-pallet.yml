name: VINTO CV-P112-01 pallet isolated QA

on:
  pull_request:
    paths:
      - '.github/workflows/cv-p112-pallet.yml'
      - 'backend/migrations/0027_conversion_pallet.sql'
      - 'backend/app/production_pallets.py'
      - 'backend/app/capture_service.py'
      - 'backend/app/capture_schemas.py'
      - 'backend/app/production_access.py'
      - 'backend/seed_data/forms/VINTO-P1-12.json'
      - 'backend/seed_data/manifest.json'
      - 'backend/tests/test_cv_p112_pallet_api.py'
      - 'backend/tests/test_bundle_validation.py'
      - 'lib/vinto/p1-12.ts'
      - 'lib/vinto/pallet-preview.ts'
      - 'lib/vinto/pallet-weight.ts'
      - 'lib/vinto/candidate-form.ts'
      - 'lib/vinto/conversion-candidates.ts'
      - 'components/vinto/candidate-form-capture.tsx'
      - 'components/vinto/candidate-history.tsx'
      - 'scripts/cv-p112-pallet.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg17:
    name: P1-12 v4 real API and migrations PG17
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: cvp112-disposable-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin:cvp112-disposable-only@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin:cvp112-disposable-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin:cvp112-disposable-only@127.0.0.1:5432/vinto_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
      WORK_ORDER_LINE_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Syntax + schema PG17
        working-directory: backend
        run: |
          python -B -m compileall -q app/production_pallets.py app/capture_service.py app/capture_schemas.py app/production_access.py tests/test_cv_p112_pallet_api.py
          python -B prepare_test_db.py
          python -B migrate.py --target test --check
      - name: P1-12 v4 pallet real API tests
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_cv_p112_pallet_api.py' -v
      - name: Bundle integrity and historical regression
        working-directory: backend
        run: |
          python -B -m unittest discover -s tests -p 'test_bundle_validation.py' -v
          python -B -m unittest discover -s tests -p 'test_mf10_rebobinado_conversion.py' -v

  frontend:
    name: P1-12 v4 contract, types, lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      VINTO_MVP_DOMAIN: vinto-mvp.baltrekservices.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: P1-12 v4 pallet contract
        run: node --test scripts/cv-p112-pallet.test.mjs
      - name: Types and lint
        run: |
          pnpm exec tsc --noEmit
          pnpm exec eslint components/vinto/candidate-form-capture.tsx components/vinto/candidate-history.tsx lib/vinto/candidate-form.ts lib/vinto/p1-12.ts lib/vinto/pallet-preview.ts lib/vinto/conversion-candidates.ts
      - name: Portable Next.js build
        run: pnpm run build
