name: E2-D2-B2A operator receipt and fail-closed PG17

on:
  pull_request:
    paths:
      - 'backend/migrations/0022_e2d2_operator_receipt_and_e1_barrier.sql'
      - 'backend/app/assignments/revision_notices.py'
      - 'backend/app/work_orders/handoff_guard.py'
      - 'backend/tests/test_e2d2b2a_receipt_safety.py'
      - 'backend/tests/test_e2d2b0_handoff_guard.py'
      - 'backend/tests/test_sector_scope.py'
      - '.github/workflows/e2d2b2a-pg17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2d2b2a-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/vinto_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned deps
        run: python -m pip install -r backend/requirements.txt
      - name: Compile changed source
        run: |
          python -B -m compileall -q backend/app/assignments/revision_notices.py \
            backend/app/work_orders/handoff_guard.py \
            backend/tests/test_e2d2b2a_receipt_safety.py
      - name: B2-A PG17 receipt, integrity and flag-off guards
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_e2d2b2a_receipt_safety.py' -v
      - name: B0/B1.1/B1.2 PG17 regressions
        working-directory: backend
        run: |
          python -B -m unittest discover -s tests -p 'test_e2d2b0_handoff_guard.py' -v
          python -B -m unittest discover -s tests -p 'test_e2d2b1_reserve_cancel.py' -v
          python -B -m unittest discover -s tests -p 'test_e2d2b12_publish_reassign.py' -v
          python -B -m unittest discover -s tests -p 'test_e2d2b1_http.py' -v
      - name: E2-C1 revision receipts PG17
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_assignments_api.py' -v
      - name: Migration SHA256 and permissions
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_sector_scope.py' -v
