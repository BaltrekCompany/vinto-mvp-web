name: VINTO USR-06 integrated release readiness

on:
  pull_request:
    paths:
      - '.github/workflows/usr-06-integrated-release.yml'
      - 'docs/USR-06-release-readiness.md'
      - 'backend/migrations/**'
      - 'backend/app/admin/**'
      - 'backend/app/auth/**'
      - 'backend/app/main.py'
      - 'backend/tests/test_admin_user_*.py'
      - 'components/vinto/admin/**'
      - 'lib/vinto/admin*.ts'
      - 'lib/vinto/use-admin-users.ts'
      - 'scripts/usr-05-admin-users*.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usr06-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-pg17:
    name: USR-06 PostgreSQL 17 + 0025 + administration/auth
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: usr06-disposable-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin:usr06-disposable-ci-only@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin:usr06-disposable-ci-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin:usr06-disposable-ci-only@127.0.0.1:5432/vinto_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned backend
        run: python -m pip install -r backend/requirements.txt
      - name: Verify actual PostgreSQL 17 and schema files
        run: |
          python - <<'PY'
          import os, psycopg, pathlib
          with psycopg.connect(os.environ["TEST_ADMIN_DATABASE_URL"]) as db:
              version = int(db.execute("SHOW server_version_num").fetchone()[0])
          assert 170000 <= version < 180000, version
          for name in ("0024_user_one_profile.sql", "0025_credential_username_immutable.sql"):
              assert pathlib.Path("backend/migrations", name).is_file(), name
          print("USR06_PG17_AND_FILES=PASS")
          PY
      - name: Apply migrations in disposable DB and verify checksums
        working-directory: backend
        run: |
          python -B prepare_test_db.py
          python -B migrate.py --target test --check
      - name: USR-02/03/04 HTTP, auth and concessions on PG17
        working-directory: backend
        run: |
          python -B -m unittest \
            tests.test_user_creation_api \
            tests.test_admin_user_edit_api \
            tests.test_admin_user_lifecycle_api \
            tests.test_auth_service \
            tests.test_auth_api \
            tests.test_auth_sessions \
            tests.test_user_deactivation \
            tests.test_admin_sector_api \
            tests.test_admin_grants_read_api \
            tests.test_admin_grants_write_api -v

  industrial-pg17:
    name: E1-08/MP3 regression 55 cases on isolated PG17
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: usr06-disposable-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin:usr06-disposable-ci-only@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin:usr06-disposable-ci-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin:usr06-disposable-ci-only@127.0.0.1:5432/vinto_ci_unused
      WORK_ORDER_LINE_EXECUTION_ENABLED: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Industrial regression E1-08/MP3
        run: python -B scripts/mp3-rg01-broad-focus.py

  frontend-node22:
    name: USR-05 108 cases + TypeScript/lint + frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VINTO_MVP_DOMAIN: vinto-mvp.baltrekservices.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install pinned frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Account UI and existing grants/sector regressions
        run: |
          node --test \
            scripts/usr-05-admin-users.test.mjs \
            scripts/usr-05-admin-users-ui.test.mjs \
            scripts/admin.test.mjs \
            scripts/admin-ui.test.mjs \
            scripts/admin-grants.test.mjs \
            scripts/admin-grants-ui.test.mjs
      - name: TypeScript, lint and full frontend build
        run: |
          pnpm exec tsc --noEmit
          pnpm exec eslint \
            lib/vinto/admin.ts lib/vinto/admin-api.ts lib/vinto/admin-users.ts lib/vinto/use-admin-users.ts \
            components/vinto/admin/admin-console.tsx components/vinto/admin/admin-user-accounts.tsx components/vinto/admin/admin-parts.tsx
          pnpm run build

  scripts-syntax:
    name: Deployment scripts syntax only - never execute deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse only
        run: |
          bash -n deploy/mvp/scripts/deploy.sh
          bash -n deploy/mvp/scripts/rollback.sh
          bash -n deploy/mvp/scripts/backup.sh
          bash -n deploy/mvp/scripts/preflight.sh
          echo "USR06_SHELL_SYNTAX=PASS"
