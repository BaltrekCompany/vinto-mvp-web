name: VINTO RBE-05 PDF, historial y reservas

on:
  pull_request:
    branches: [main, feat/rbe-04-rewinding-export-backend-2026-11-27]
    paths:
      - '.github/workflows/rbe-05-pdf-history.yml'
      - 'backend/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: rbe05-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate:
    name: Candidato combinado RBE-03/04/05
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: rbe05-disposable-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
      WORK_ORDER_LINE_EXECUTION_ENABLED: 'false'
      TEST_DATABASE_URL: postgresql://ci_admin:rbe05-disposable-only@127.0.0.1:5432/vinto_rbe05_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin:rbe05-disposable-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin:rbe05-disposable-only@127.0.0.1:5432/vinto_rbe05_unused
      RBE05_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # On pull_request, HEAD is the merge result and the source is its parent.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18.0'
      - name: Registrar commit y preparar herramientas
        id: setup
        run: |
          RBE05_EVIDENCE_DIR="$RUNNER_TEMP/rbe05-evidence"
          mkdir -p "$RBE05_EVIDENCE_DIR"
          echo "RBE05_EVIDENCE_DIR=$RBE05_EVIDENCE_DIR" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$RBE05_EVIDENCE_DIR/checkout.sha"
          printf '%s\n' "$RBE05_HEAD_SHA" > "$RBE05_EVIDENCE_DIR/pr-head.sha"
          git merge-base --is-ancestor "$RBE05_HEAD_SHA" HEAD
          sudo apt-get update
          if [[ ! -x /usr/lib/postgresql/17/bin/pg_dump ]]; then
            sudo apt-get install -y postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y postgresql-client-17
          fi
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          sudo apt-get install -y poppler-utils
          python -m pip install -r backend/requirements.txt
          npm install --global pnpm@11.25.0
      - name: PostgreSQL 17, API y PDF
        id: backend
        working-directory: backend
        run: |
          set -euo pipefail
          {
            pg_dump --version
            printf '%s  %s\n' d95e74f56353fe25750dd30f753bbb623af898fb23ab247a944a2100448d23e1 migrations/0032_rewinding_export_backend.sql | sha256sum -c -
            python prepare_test_db.py
            python migrate.py --target test --check
            PYTHONPATH=tests:. python -m unittest discover -s tests/integration -p test_rewinding_export_api.py -v
            for suite in test_rewinding_export_contract.py test_rewinding_export_integrity.py test_rewinding_export_pdf.py \
              test_schema.py test_sector_scope.py test_rb_crias_quality_api.py test_mf10_rebobinado_conversion.py test_quality_offline_receiver.py test_quality_offline_single_submit.py; do
              python -m unittest discover -s tests -p "$suite" -v
            done
          } 2>&1 | tee "$RBE05_EVIDENCE_DIR/backend.log"
      - name: ESLint, TypeScript, navegador, regresión y build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        id: frontend
        run: |
          set -euo pipefail
          {
            pnpm install --frozen-lockfile
            pnpm lint
            pnpm exec tsc --noEmit --incremental false
            node --experimental-strip-types --test scripts/rbe03-ui.test.mjs scripts/pb-clean-tracking.test.mjs \
              scripts/p1-30-p1-07-capture.test.mjs scripts/quality-bobbin-history.test.mjs \
              scripts/mf10-rebobinado-conversion.test.mjs scripts/mf11-calidad-conversion.test.mjs \
              scripts/quality-offline-human-navigation.test.mjs scripts/quality-offline-end-to-end-contract.test.mjs
            npm install --prefix "$RUNNER_TEMP/rbe05-browser" --no-save --package-lock=false playwright@1.65.1
            ln -s "$RUNNER_TEMP/rbe05-browser/node_modules/playwright" node_modules/playwright
            "$RUNNER_TEMP/rbe05-browser/node_modules/.bin/playwright" install --with-deps chromium
            node --test tests/rewinding-export/browser.test.mjs
            pnpm build
          } 2>&1 | tee "$RBE05_EVIDENCE_DIR/frontend.log"
      - name: Renderizar vistas representativas
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        id: render
        run: |
          cd "$RBE05_EVIDENCE_DIR"
          pdftoppm -f 1 -l 1 -scale-to 1400 -png sintetico-1.pdf vista-1
          pdftoppm -f 1 -l 1 -scale-to 1400 -png sintetico-20.pdf vista-20
          pdftoppm -f 1 -l 2 -scale-to 1400 -png sintetico-21.pdf vista-21
          pdftoppm -f 102 -l 102 -scale-to 1400 -png sintetico-2021.pdf vista-2021
      - name: Generar resumen y manifiesto verificable
        if: ${{ !cancelled() }}
        env:
          BACKEND_OUTCOME: ${{ steps.backend.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          directory = Path(os.environ["RBE05_EVIDENCE_DIR"])
          directory.mkdir(exist_ok=True)
          summary = {"pr_head": os.environ["RBE05_HEAD_SHA"]}
          checkout = directory / "checkout.sha"
          summary["checkout"] = checkout.read_text().strip() if checkout.exists() else None
          for name in ("backend", "frontend", "render"):
              log = directory / (name + ".log")
              text = log.read_text(errors="replace") if log.exists() else ""
              counts = re.findall(r"^Ran (\d+) tests? in |^(?:#|ℹ) tests (\d+)", text, re.M)
              summary[name] = {"outcome": os.environ[name.upper() + "_OUTCOME"],
                               "reported_tests": sum(int(a or b) for a, b in counts)}
          (directory / "resumen.json").write_text(json.dumps(summary, indent=2) + "\n")
          PY
          cd "$RBE05_EVIDENCE_DIR"
          manifest="$RUNNER_TEMP/rbe05-SHA256SUMS"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$manifest"
          mv "$manifest" SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publicar PDFs, capturas, logs y evidencia
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rbe05-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RBE05_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14
