name: VINTO Tubetes report TUB-02 (PostgreSQL 17)

on:
  pull_request:
    paths:
      - 'backend/app/reports/**'
      - 'backend/app/auth/permissions.py'
      - 'backend/app/main.py'
      - 'backend/tests/test_tubetes_report_*.py'
      - 'backend/tests/test_auth_service.py'
      - 'backend/tests/test_sector_scope.py'
      - 'lib/vinto/auth.ts'
      - 'lib/vinto/tubetes-report.ts'
      - 'lib/vinto/tubetes-report-api.ts'
      - 'components/vinto/tubetes-report.tsx'
      - 'app/page.tsx'
      - 'scripts/auth.test.mjs'
      - 'scripts/tubetes-report.test.mjs'
      - '.github/workflows/tubetes-report-pg17.yml'

permissions:
  contents: read

concurrency:
  group: tubetes-report-pg17-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-pg17:
    name: TUB-02 API and fixtures on isolated PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: tubetes-ci-disposable-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin:tubetes-ci-disposable-only@127.0.0.1:5432/vinto_tubetes_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin:tubetes-ci-disposable-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin:tubetes-ci-disposable-only@127.0.0.1:5432/vinto_tubetes_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify PostgreSQL 17
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["TEST_ADMIN_DATABASE_URL"]) as db:
              version = int(db.execute("SHOW server_version_num").fetchone()[0])
          assert 170000 <= version < 180000, version
          print("TUBETES_PG17=PASS")
          PY
      - name: Tubetes aggregation, read-only boundary, HTTP and synthetic PG17 fixtures
        working-directory: backend
        run: python -B -m unittest tests.test_tubetes_report_service tests.test_tubetes_report_api -v
      - name: Permission matrix and sector-scope regression
        working-directory: backend
        env:
          PYTHONPATH: tests:.
        run: |
          python -B -m unittest tests.test_auth_service.PermissionMatrixTests -v
          python -B -m unittest -v test_sector_scope.StaticScopeTests
      - name: P1-03 and Quality regression on ephemeral PG17
        working-directory: backend
        run: python -B -m unittest tests.test_f3_bobbins_api tests.test_quality_bobbin_decision_api -v

  frontend:
    name: Frontend permission type, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Authentication and permission regression
        run: node --test scripts/auth.test.mjs
      - name: Tubetes report response contract
        run: node --test scripts/tubetes-report.test.mjs
      - name: TypeScript, ESLint and frontend build
        run: |
          pnpm exec tsc --noEmit
          pnpm exec eslint lib/vinto/auth.ts
          pnpm run build
