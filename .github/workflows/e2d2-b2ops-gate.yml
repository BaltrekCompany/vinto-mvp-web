name: E2-D2 B2-OPS release/rollback and flag gate

on:
  pull_request:
    paths:
      - 'deploy/mvp/scripts/deploy.sh'
      - 'deploy/mvp/scripts/rollback.sh'
      - 'deploy/mvp/scripts/lib_common.sh'
      - 'backend/app/work_orders/handoff_rollout_cli.py'
      - 'backend/tests/test_e2d2_b2ops_identity.py'
      - 'deploy/mvp/scripts/tests/test_d2_ops_gate.sh'
      - 'deploy/mvp/scripts/tests/test_healthcheck_fail_closed.sh'
      - 'docs/E2-D2-B2OPS-DESPLIEGUE-SEGURO.md'
      - '.github/workflows/e2d2-b2ops-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bash syntax and D2-OPS isolated gates
        run: |
          bash -n deploy/mvp/scripts/deploy.sh
          bash -n deploy/mvp/scripts/rollback.sh
          bash -n deploy/mvp/scripts/lib_common.sh
          bash -n deploy/mvp/scripts/tests/test_d2_ops_gate.sh
          bash deploy/mvp/scripts/tests/test_d2_ops_gate.sh
          bash -n deploy/mvp/scripts/tests/test_healthcheck_fail_closed.sh
          bash deploy/mvp/scripts/tests/test_healthcheck_fail_closed.sh
      - name: Static shellcheck
        run: |
          shellcheck --severity=error -x \
            deploy/mvp/scripts/deploy.sh \
            deploy/mvp/scripts/rollback.sh \
            deploy/mvp/scripts/tests/test_d2_ops_gate.sh \
            deploy/mvp/scripts/tests/test_healthcheck_fail_closed.sh

  postgres-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin@127.0.0.1:5432/vinto_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python deps
        run: python -m pip install -r backend/requirements.txt
      - name: D2-OPS migration identity and secret-redaction unit tests
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_e2d2_b2ops_identity.py' -v
      - name: D2 zero/open handoffs and read-only preflight regression
        working-directory: backend
        run: |
          python -B -m unittest discover -s tests -p 'test_e2d2b2b_recovery_gate.py' -v
          python -B -m unittest discover -s tests -p 'test_e2d2b2a_receipt_safety.py' -v
          python -B -m unittest discover -s tests -p 'test_sector_scope.py' -v
