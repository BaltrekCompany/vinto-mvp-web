name: OFF-04.5B-06B QA Authentication and Mobile Offline Client QA (isolated, synthetic)

on:
  pull_request:
    paths:
      - 'backend/app/qa_pilot_auth.py'
      - 'backend/app/qa_pilot_main.py'
      - 'backend/app/qa_offline_pilot.py'
      - 'backend/app/qa_offline_guard.py'
      - 'backend/app/offline_capture/**'
      - 'backend/app/auth/**'
      - 'backend/tests/test_off045b*'
      - 'backend/tests/off045b*'
      - 'backend/tests/off0506b_*'
      - 'backend/tests/off044_*'
      - 'lib/vinto/offline-*.ts'
      - 'lab/**'
      - 'public/sw.js'
      - 'scripts/build-offline-boot.mjs'
      - 'scripts/off-04-*'
      - 'docs/OFF-04-5B-06B-*.md'
      - '.github/workflows/off-04-5b-06b-mobile-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ENV: ci
  TEST_DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/vinto_ci_test
  TEST_ADMIN_DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/postgres
  DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/vinto_ci_unused
  OFF044_PG_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/postgres
  OFF044_REQUIRE_PG: '1'
  OFF045B03_REQUIRE_PG: '1'
  OFF045B06B_REQUIRE_PG: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  backend-asgi-postgres17:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-disposable-pg17-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt pytest httpx
      - name: Authentication, Origin/CSRF, dedicated identity connection and synthetic issuer on throwaway PostgreSQL 17 (never a deployed database)
        working-directory: backend
        run: python -m pytest tests/test_off045b06b_mobile_auth.py -v
      - name: Regressions OFF-04.4, OFF-04.5B-01, OFF-04.5B-03 (bootstrap, 0032, authz probe) and signing
        working-directory: backend
        run: |
          python -m pytest tests/test_off045b03_qa_bootstrap.py tests/test_off045b_qa_pilot.py tests/test_off044_receiver.py -q
          python -m pytest tests/test_off03c1_unit.py tests/test_off03b2_signing.py -q
      - name: Nothing is wired into the operational app; the migration is still not an operational one
        run: |
          ! grep -q "qa_pilot\|qa_offline_pilot\|offline_capture" backend/app/main.py
          test ! -e backend/migrations/0032_offline_capture_receipt.sql
          ! grep -rl "qa_pilot_auth" backend/app --include=*.py | grep -v -E "backend/app/(qa_pilot_auth|qa_pilot_main|qa_offline_pilot)\.py"

  contracts-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: Node contracts (client contracts, sync engine, queue, drafts, vault, renewal)
        env:
          OFF04_FIXTURE_JSON: ${{ runner.temp }}/off04.json
          OFF03C4_FIXTURE_JSON: ${{ runner.temp }}/off03c4.json
          OFF03B3_FIXTURE_JSON: ${{ runner.temp }}/off03b3.json
          OFF03C2_FIXTURE_JSON: ${{ runner.temp }}/off03b3.json
          OFF044_PYTHON: python
        run: |
          python scripts/off04_fixture.py
          python scripts/off03c4_fixture.py
          python scripts/off03b3_fixture.py
          node --experimental-strip-types --test scripts/off-04-5b-06b-mobile-auth-static.test.mjs scripts/off-04-sync-static.test.mjs scripts/off-04-sync-engine.test.mjs scripts/off-04-queue.test.mjs scripts/off-04-draft-schema.test.mjs scripts/off-03c4-renewal.test.mjs
          node --experimental-strip-types --test scripts/off-03c2-package.test.mjs scripts/off-03b3-signature.test.mjs scripts/off-03b-contract.test.mjs scripts/off-03a-vault.test.mjs
      - name: TypeScript and ESLint
        run: |
          pnpm exec tsc --noEmit
          pnpm lint
      - name: Default build ships NO laboratory; the opt-in build generates it
        run: |
          pnpm build
          test ! -e public/offline-e2e-lab.html
          test ! -e public/offline-e2e-lab.js
          test ! -e dist/standalone/public/offline-e2e-lab.html
          OFFLINE_DRAFT_LAB=1 node scripts/build-offline-boot.mjs
          test -s public/offline-e2e-lab.html
          node --check public/offline-e2e-lab.js
          node scripts/build-offline-boot.mjs
          test ! -e public/offline-e2e-lab.html
          echo OFF045B06B_LAB_OPT_IN_BUILD=PASS

  chrome-e2e-same-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-disposable-pg17-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
          python -m pip install -r backend/requirements.txt pytest httpx playwright==1.57.0
          google-chrome --version
      - name: Build the laboratory (opt-in) into ./public
        env:
          OFFLINE_DRAFT_LAB: '1'
        run: node scripts/build-offline-boot.mjs
      - name: Chrome end to end on ONE origin - real cookie, QA pilot app, PostgreSQL 17, restricted application role and dedicated identity role
        env:
          OFF06B_PUBLIC: ${{ github.workspace }}/public
        run: |
          cd scripts
          PYTHONPATH=. python off-04-5b-06b-mobile-auth-e2e-browser.py
