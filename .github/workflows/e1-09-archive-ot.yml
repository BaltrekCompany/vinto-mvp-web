name: E1-09 archive OT PostgreSQL 17 and frontend

on:
  pull_request:
    paths:
      - 'backend/migrations/0014_work_order_archive.sql'
      - 'backend/app/work_orders/**'
      - 'backend/tests/test_work_order_archive.py'
      - 'backend/tests/test_work_orders_api.py'
      - 'components/vinto/bobinas-programming.tsx'
      - 'lib/vinto/work-orders-api.ts'
      - '.github/workflows/e1-09-archive-ot.yml'
  push:
    branches:
      - 'feat/e1-09-archivado-ot-ficticias-20261106'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-disposable-pg17-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: ci
      TEST_DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/vinto_ci_test
      TEST_ADMIN_DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://ci_admin:ci-disposable-pg17-only@127.0.0.1:5432/vinto_ci_unused
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -B -m compileall -q backend/app/work_orders backend/tests/test_work_order_archive.py backend/tests/test_work_orders_api.py
      - name: Archive DB integrity and restore history
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_work_order_archive.py' -v
      - name: Archive HTTP authorization and scope
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_work_orders_api.py' -v
      - name: Existing work order service regressions
        working-directory: backend
        run: python -B -m unittest discover -s tests -p 'test_work_orders_service.py' -v
      - name: Existing assignment and close regressions
        working-directory: backend
        run: |
          python -B -m unittest discover -s tests -p 'test_assignment_same_work_order.py' -v
          python -B -m unittest discover -s tests -p 'test_work_order_close_flow.py' -v

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Existing OT and E1 regression tests
        run: |
          node --test scripts/pr6-order-draft.test.mjs
          node --test scripts/e1-07-work-order-close.test.mjs
      - name: TypeScript contract
        run: pnpm exec tsc --noEmit
      - name: Lint modified archive UI and API wrappers
        run: pnpm exec eslint components/vinto/bobinas-programming.tsx lib/vinto/work-orders-api.ts
