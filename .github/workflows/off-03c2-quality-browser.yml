name: OFF-03C2 Encrypted Quality Form Package Browser QA

on:
  pull_request:
    paths:
      - 'lib/vinto/offline-quality-*.ts'
      - 'lib/vinto/offline-profile-store.ts'
      - 'lib/vinto/offline-scope-verify.ts'
      - 'lib/vinto/offline-boot.ts'
      - 'app/offline-preparacion/page.tsx'
      - 'public/offline.html'
      - 'public/offline-device-qa.js'
      - 'scripts/off-03c3-*.mjs'
      - 'docs/OFF-03C3-qa-movil-calidad.md'
      - 'public/sw.js'
      - 'scripts/off-03b3-signature.test.mjs'
      - 'scripts/off-03b-contract.test.mjs'
      - 'scripts/off03b3_fixture.py'
      - 'scripts/off-03c2-*'
      - '.github/workflows/off-03c2-quality-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-quality-contract-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: Python signs whole form, Node verifies SHA256 and scope pin
        env:
          OFF03B3_FIXTURE_JSON: ${{ runner.temp }}/off03c2-quality-package.json
          OFF03C2_FIXTURE_JSON: ${{ runner.temp }}/off03c2-quality-package.json
        run: |
          python scripts/off03b3_fixture.py
          node --experimental-strip-types --test scripts/off-03c2-package.test.mjs
          node --test scripts/off-03c3-device-qa.test.mjs
      - name: TypeScript and ESLint
        run: |
          pnpm exec tsc --noEmit
          pnpm lint
      - name: Portable offline bundle and static syntax
        run: |
          pnpm build
          test -s dist/standalone/server.js
          cmp -s public/offline-boot.js dist/standalone/public/offline-boot.js
          node --check public/offline-boot.js
          node --check public/offline-device-qa.js
          echo OFF03C2_PORTABLE_BUNDLE=PASS

  chrome-restart-quality-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
          python -m pip install -r backend/requirements.txt playwright==1.57.0
          google-chrome --version
      - name: Start isolated frontend
        run: |
          set -eu
          nohup pnpm dev > "$RUNNER_TEMP/off03c2-dev.log" 2>&1 &
          for i in $(seq 1 40); do
            for endpoint in 'http://localhost:5173/' 'http://127.0.0.1:5173/' 'http://[::1]:5173/'; do
              if curl --fail --silent --noproxy '*' --connect-timeout 1 --max-time 3 --output /dev/null "$endpoint"; then
                echo "OFF03C2_BASE_URL=${endpoint%/}" >> "$GITHUB_ENV"
                exit 0
              fi
            done
            sleep 2
          done
          tail -n 140 "$RUNNER_TEMP/off03c2-dev.log"
          exit 1
      - name: Real Chrome online signed scope, encrypted full form, restart offline and corrupt ciphertext
        env:
          OFF03C2_BASE_URL: ${{ env.OFF03C2_BASE_URL }}
          OFF03C2_SCREENSHOT: ${{ runner.temp }}/off03c2-complete-quality-form.png
        run: python scripts/off-03c2-browser-smoke.py
      - name: Evidence screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: off03c2-chrome-quality-definition-evidence
          path: ${{ runner.temp }}/off03c2-complete-quality-form.png
          retention-days: 14
      - name: Show app logs on failure
        if: failure()
        run: tail -n 140 "$RUNNER_TEMP/off03c2-dev.log" || true
