name: SEC-HOST-01 A0.1 Connection Observation Preparation (No Writes)

on:
  pull_request:
    paths:
      - 'scripts/sec-host-01-a01-observation-preflight.sh'
      - 'scripts/sec-host-01-a01-observation-preflight.test.mjs'
      - 'scripts/sec-host-01-a01-restore-policy.mjs'
      - 'scripts/sec-host-01-a01-restore-policy.test.mjs'
      - 'docs/SEC-HOST-01-A01-temporary-connection-observation.md'
      - '.github/workflows/sec-host-01-a01-observation-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-observation-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Verify audit syntax, deny mutating modes, test restoring original GUC source
        run: |
          bash -n scripts/sec-host-01-a01-observation-preflight.sh
          node --test scripts/sec-host-01-a01-observation-preflight.test.mjs scripts/sec-host-01-a01-restore-policy.test.mjs
