name: OFF-02 PWA and IndexedDB foundation

on:
  pull_request:
    paths:
      - 'public/sw.js'
      - 'public/offline.html'
      - 'public/offline-probe.js'
      - 'public/manifest.webmanifest'
      - 'lib/vinto/offline-store.ts'
      - 'components/vinto/offline-registration.tsx'
      - 'app/layout.tsx'
      - 'scripts/off-02-foundation.test.mjs'
      - '.github/workflows/off-02-foundation.yml'
      - 'scripts/off-02-browser-smoke.py'
      - 'scripts/off-02-browser-fixture.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Syntax checks (public worker and offline probe)
        run: |
          node --check public/sw.js
          node --check public/offline-probe.js
      - name: OFF-02 security and storage contract
        run: node --experimental-strip-types --test scripts/off-02-foundation.test.mjs

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Enable pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc --noEmit

  browser-public-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Python for actual Chrome
        run: |
          python3 -m pip install --break-system-packages playwright==1.57.0
          google-chrome --version
      - name: Serve repository public assets with test-only root
        run: |
          set -eu
          nohup python3 scripts/off-02-browser-fixture.py > "$RUNNER_TEMP/off02-fixture.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/off02-fixture.log"
          exit 1
      - name: Chrome persistent-profile offline restart QA
        env:
          OFF02_BASE_URL: http://127.0.0.1:8765
          OFF02_CHROME_CHANNEL: chrome
          OFF02_SCREENSHOT_PATH: ${{ runner.temp }}/off02-after-reopen.png
        run: python3 scripts/off-02-browser-smoke.py
      - name: Upload Chrome offline evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: off02-chrome-public-shell-evidence
          path: ${{ runner.temp }}/off02-after-reopen.png
          if-no-files-found: error
          retention-days: 14
      - name: Show fixture logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/off02-fixture.log" || true
