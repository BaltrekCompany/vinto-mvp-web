name: OFF-02 PWA and IndexedDB foundation

on:
  pull_request:
    paths:
      - 'public/sw.js'
      - 'public/offline.html'
      - 'public/offline-probe.js'
      - 'public/manifest.webmanifest'
      - 'lib/vinto/offline-store.ts'
      - 'components/vinto/offline-registration.tsx'
      - 'app/layout.tsx'
      - 'scripts/off-02-foundation.test.mjs'
      - '.github/workflows/off-02-foundation.yml'
      - 'scripts/off-02-browser-smoke.py'
      - 'scripts/off-02-browser-fixture.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Syntax checks (public worker and offline probe)
        run: |
          node --check public/sw.js
          node --check public/offline-probe.js
      - name: OFF-02 security and storage contract
        run: node --experimental-strip-types --test scripts/off-02-foundation.test.mjs

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Enable pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc --noEmit

  browser-public-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Python for actual Chrome
        run: |
          python3 -m pip install --break-system-packages playwright==1.57.0
          google-chrome --version
      - name: Serve repository public assets with test-only root
        run: |
          set -eu
          nohup python3 scripts/off-02-browser-fixture.py > "$RUNNER_TEMP/off02-fixture.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/off02-fixture.log"
          exit 1
      - name: Chrome persistent-profile offline restart QA
        env:
          OFF02_BASE_URL: http://127.0.0.1:8765
          OFF02_CHROME_CHANNEL: chrome
          OFF02_SCREENSHOT_PATH: ${{ runner.temp }}/off02-after-reopen.png
        run: python3 scripts/off-02-browser-smoke.py
      - name: Upload Chrome offline evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: off02-chrome-public-shell-evidence
          path: ${{ runner.temp }}/off02-after-reopen.png
          if-no-files-found: error
          retention-days: 14
      - name: Show fixture logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/off02-fixture.log" || true

  browser-integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Prepare frozen dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: Install real Chrome test driver
        run: |
          python3 -m pip install --break-system-packages playwright==1.57.0
          google-chrome --version
      - name: Start actual VINTO dev frontend and diagnose IPv4 vs IPv6
        run: |
          set -eu
          nohup pnpm dev > "$RUNNER_TEMP/off02-vinto-dev.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/off02-vinto-dev.pid"
          for i in $(seq 1 35); do
            for endpoint in 'http://localhost:5173/' 'http://127.0.0.1:5173/' 'http://[::1]:5173/'; do
              if curl --fail --silent --noproxy '*' --connect-timeout 1 --max-time 2 --output /dev/null "$endpoint"; then
                echo "OFF02_LIVE_BASE=${endpoint%/}" >> "$GITHUB_ENV"
                echo "OFF02_INTEGRATED_PREFLIGHT=PASS $endpoint"
                exit 0
              fi
            done
            sleep 2
          done
          echo "OFF02_INTEGRATED_PREFLIGHT=FAILED"
          ss -ltnp | grep 5173 || true
          for endpoint in 'http://localhost:5173/' 'http://127.0.0.1:5173/' 'http://[::1]:5173/'; do
            curl --verbose --noproxy '*' --connect-timeout 2 --max-time 5 "$endpoint" -o /dev/null || true
          done
          tail -n 180 "$RUNNER_TEMP/off02-vinto-dev.log"
          exit 1
      - name: Chrome actual VINTO root then offline restart test
        env:
          OFF02_BASE_URL: ${{ env.OFF02_LIVE_BASE }}
          OFF02_EXPECT_FIXTURE: '0'
          OFF02_CHROME_CHANNEL: chrome
          OFF02_SCREENSHOT_PATH: ${{ runner.temp }}/off02-integrated-reopen.png
        run: python3 scripts/off-02-browser-smoke.py
      - name: Upload integrated Chrome screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: off02-chrome-integrated-evidence
          path: ${{ runner.temp }}/off02-integrated-reopen.png
          if-no-files-found: error
          retention-days: 14
      - name: Show VINTO dev failure logs
        if: failure()
        run: tail -n 150 "$RUNNER_TEMP/off02-vinto-dev.log" || true

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install frozen dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: ESLint full repository
        run: pnpm lint

  central-only-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install frozen dependencies for candidate
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: Run INT-02A on OFF-02 branch and retain full TAP evidence
        shell: bash
        run: |
          set +e
          node --test scripts/int-02a-central-only.test.mjs > "$RUNNER_TEMP/off02-candidate.tap" 2>&1
          rc=$?
          set -e
          echo "INT02A_CANDIDATE_EXIT=$rc" >> "$GITHUB_ENV"
          grep -E '^# (tests|pass|fail) |^not ok ' "$RUNNER_TEMP/off02-candidate.tap" || true
      - name: Checkout unchanged main baseline (exact OFF-02 fork point)
        uses: actions/checkout@v4
        with:
          ref: '2ca165af615ad5405a526e40d73e96ff8f83b4a6'
          path: 'off02-baseline'
          persist-credentials: false
      - name: Install frozen dependencies for baseline
        working-directory: off02-baseline
        run: pnpm install --frozen-lockfile
      - name: Run the SAME INT-02A test on baseline
        shell: bash
        working-directory: off02-baseline
        run: |
          set +e
          node --test scripts/int-02a-central-only.test.mjs > "$RUNNER_TEMP/off02-baseline.tap" 2>&1
          rc=$?
          set -e
          echo "INT02A_BASELINE_EXIT=$rc" >> "$GITHUB_ENV"
          grep -E '^# (tests|pass|fail) |^not ok ' "$RUNNER_TEMP/off02-baseline.tap" || true
      - name: Compare exact failing test names and counts (do not hide legacy failures)
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/off02-candidate.tap" "$RUNNER_TEMP/off02-baseline.tap" <<'PY'
          import os
          import pathlib
          import re
          import sys

          def summary(path):
              data = pathlib.Path(path).read_text()
              def count(field):
                  match = re.search(rf"^# {field} (\d+)$", data, flags=re.M)
                  if match is None:
                      raise RuntimeError(f"Missing TAP count {field} in {path}")
                  return int(match.group(1))
              failures = sorted(re.findall(r"^not ok \d+ - (.+)$", data, flags=re.M))
              return {"tests": count("tests"), "pass": count("pass"), "fail": count("fail"), "failing_names": failures}

          candidate, baseline = summary(sys.argv[1]), summary(sys.argv[2])
          print("INT02A_CANDIDATE:", candidate)
          print("INT02A_BASELINE:", baseline)
          same = candidate == baseline
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("### INT-02A differential regression (OFF-02 vs pinned main)\n")
              out.write(f"Candidate: {candidate['pass']}/{candidate['tests']} pass, {candidate['fail']} fail.\n\n")
              out.write(f"Baseline: {baseline['pass']}/{baseline['tests']} pass, {baseline['fail']} fail.\n\n")
              out.write("**The original INT-02A regression is not green.** This control passes only when candidate and pinned main produce identical failure counts and test names.\n\n")
              out.write(f"Differential result: {'PASS (no additional failures)' if same else 'FAIL (regression changed)'}.\n")
          if baseline["fail"]:
              print(f"::warning::INT-02A baseline already fails {baseline['fail']} tests on pinned main; repair in separately reviewed work.")
          if not same:
              print("::error::OFF-02 changes central-only test outcomes relative to main.")
              sys.exit(1)
          print("OFF02_INT02A_DIFFERENTIAL=PASS")
          PY

  portable-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_API_URL: https://vinto-ci.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install frozen dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: Build portable VINTO frontend without production access
        run: pnpm build
      - name: Verify standalone and inspect OFF-02 PWA assets
        run: |
          set -eu
          test -s dist/standalone/server.js
          echo "OFF02_STANDALONE_SERVER=PASS"
          for asset in sw.js offline.html offline-probe.js manifest.webmanifest favicon.svg; do
            test -s "dist/standalone/public/$asset"
            cmp -s "public/$asset" "dist/standalone/public/$asset"
            echo "OFF02_STANDALONE_PUBLIC_ASSET=PASS $asset"
          done
          echo "OFF02_PORTABLE_BUILD=PASS"
